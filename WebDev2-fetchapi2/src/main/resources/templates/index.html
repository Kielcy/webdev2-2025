<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Car Management System</title>
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <script src="/js/fetch.jss"></script>
</head>
<body>
    <div class="container">
                            <h1>Car Management System</h1>
                    

                    <div th:if="${message}" class="alert alert-success">
                        <span th:text="${message}"></span>
                    </div>
                    
                    <div style="text-align: center; margin-bottom: 20px;">
                        <a href="/add" class="btn btn-primary">Add New Car</a>
                        <form th:action="@{/logout}" method="post" style="display: inline;">
                            <button type="submit" class="btn btn-danger">Logout</button>
                        </form>
                    </div>

        <table>
                                    <thead>
                            <tr>
                                <th class="hidden-column">ID</th>
                                <th>Make</th>
                                <th>Model</th>
                                <th>Year</th>
                                <th>Color</th>
                                <th>Body Type</th>
                                <th>Engine Type</th>
                                <th>License Plate</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
            <tbody>
                                            <tr th:each="car : ${cars}">
                                <td th:text="${car.id}" class="hidden-column">1</td>
                                <td th:text="${car.make}">Toyota</td>
                                <td th:text="${car.model}">Camry</td>
                                <td th:text="${car.year}">2022</td>
                                <td th:text="${car.color}">Silver</td>
                                <td th:text="${car.bodyType}">Sedan</td>
                                <td th:text="${car.engineType}">Gasoline</td>
                                <td th:text="${car.licensePlate}">ABC123</td>
                                <td class="actions">
                                    <a th:href="@{/view/{id}(id=${car.id})}" class="btn btn-primary">View</a>
                                    <a th:href="@{/edit/{id}(id=${car.id})}" class="btn btn-warning">Edit</a>
                                    <a th:href="@{/delete/{id}(id=${car.id})}" class="btn btn-danger" 
                                    onclick="return confirm('Are you sure you want to delete this car?')">Delete</a>
                                </td>
                            </tr>
                                            <tr th:if="${#lists.isEmpty(cars)}">
                                <td colspan="8" style="text-align: center; color: var(--color-text-secondary);">No cars found. Create your first car!</td>
                            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
