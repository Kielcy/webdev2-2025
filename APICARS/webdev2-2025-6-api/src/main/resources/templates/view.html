<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${car.model}">Car Model</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">
                    <i class="fas fa-car mr-2"></i>
                    Car View
                </h1>
                <div class="flex space-x-4">
                    <a th:href="@{/}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition duration-200 flex items-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to List
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-8 py-6 text-white">
                    <h2 class="text-2xl font-bold" th:text="${car.model}">Car Model</h2>
                    <p class="text-blue-100 mt-2">Vehicle information</p>
                </div>
                
                <div class="p-8">
                    <div class="text-center">
                        <div class="bg-blue-100 rounded-full p-6 w-24 h-24 mx-auto mb-4 flex items-center justify-center">
                            <i class="fas fa-car text-blue-600 text-3xl"></i>
                        </div>
                        <h3 class="text-xl font-semibold text-gray-800 mb-2" th:text="${car.model}">Model</h3>
                        <p class="text-gray-600">This is a simple view of the car model.</p>
                    </div>
                    
                    <div class="mt-8 text-center">
                        <a th:href="@{/show(id=${car.id})}" class="bg-blue-500 hover:bg-blue-600 text-white px-6 py-3 rounded-lg transition duration-200 flex items-center justify-center">
                            <i class="fas fa-eye mr-2"></i>
                            View Full Details
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
