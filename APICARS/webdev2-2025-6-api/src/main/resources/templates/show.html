<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${car.make} + ' ' + ${car.model}">Car Details</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">
                    <i class="fas fa-car mr-2"></i>
                    Car Details
                </h1>
                <div class="flex space-x-4">
                    <a th:href="@{/}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition duration-200 flex items-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to List
                    </a>
                    <a th:href="@{/car-dashboard}" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-2 rounded-lg transition duration-200 flex items-center">
                        <i class="fas fa-tachometer-alt mr-2"></i>
                        Modern Dashboard
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-4xl mx-auto">
            <!-- Car Details Card -->
            <div class="bg-white rounded-lg shadow-lg overflow-hidden">
                <!-- Car Header -->
                <div class="bg-gradient-to-r from-blue-500 to-blue-600 px-8 py-6 text-white">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-3xl font-bold" th:text="${car.make} + ' ' + ${car.model}">Car Name</h2>
                            <p class="text-blue-100 mt-2">Complete vehicle information</p>
                        </div>
                        <div class="text-right">
                            <div class="text-4xl font-bold" th:text="${car.year}">Year</div>
                            <div class="text-blue-100">Model Year</div>
                        </div>
                    </div>
                </div>

                <!-- Car Details Grid -->
                <div class="p-8">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- Basic Information -->
                        <div class="space-y-6">
                            <h3 class="text-xl font-semibold text-gray-800 border-b border-gray-200 pb-2">
                                <i class="fas fa-info-circle mr-2 text-blue-500"></i>
                                Basic Information
                            </h3>
                            
                            <div class="space-y-4">
                                <div class="flex items-center p-4 bg-gray-50 rounded-lg">
                                    <div class="bg-blue-100 p-3 rounded-full mr-4">
                                        <i class="fas fa-industry text-blue-600 text-xl"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm text-gray-600">Make</div>
                                        <div class="text-lg font-semibold text-gray-800" th:text="${car.make}">Make</div>
                                    </div>
                                </div>

                                <div class="flex items-center p-4 bg-gray-50 rounded-lg">
                                    <div class="bg-green-100 p-3 rounded-full mr-4">
                                        <i class="fas fa-car text-green-600 text-xl"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm text-gray-600">Model</div>
                                        <div class="text-lg font-semibold text-gray-800" th:text="${car.model}">Model</div>
                                    </div>
                                </div>

                                <div class="flex items-center p-4 bg-gray-50 rounded-lg">
                                    <div class="bg-purple-100 p-3 rounded-full mr-4">
                                        <i class="fas fa-calendar text-purple-600 text-xl"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm text-gray-600">Year</div>
                                        <div class="text-lg font-semibold text-gray-800" th:text="${car.year}">Year</div>
                                    </div>
                                </div>

                                <div class="flex items-center p-4 bg-gray-50 rounded-lg">
                                    <div class="bg-pink-100 p-3 rounded-full mr-4">
                                        <i class="fas fa-palette text-pink-600 text-xl"></i>
                                    </div>
                                    <div>
                                        <div class="text-sm text-gray-600">Color</div>
                                        <div class="text-lg font-semibold text-gray-800" th:text="${car.color}">Color</div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Additional Information -->
                        <div class="space-y-6">
                            <h3 class="text-xl font-semibold text-gray-800 border-b border-gray-200 pb-2">
                                <i class="fas fa-chart-bar mr-2 text-green-500"></i>
                                Additional Details
                            </h3>
                            
                            <div class="space-y-4">
                                <div class="p-6 bg-gradient-to-r from-blue-50 to-blue-100 rounded-lg border-l-4 border-blue-500">
                                    <div class="flex items-center">
                                        <i class="fas fa-id-card text-blue-600 text-xl mr-3"></i>
                                        <div>
                                            <div class="text-sm text-blue-600 font-medium">Vehicle ID</div>
                                            <div class="text-lg font-bold text-blue-800" th:text="${car.id}">ID</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="p-6 bg-gradient-to-r from-green-50 to-green-100 rounded-lg border-l-4 border-green-500">
                                    <div class="flex items-center">
                                        <i class="fas fa-check-circle text-green-600 text-xl mr-3"></i>
                                        <div>
                                            <div class="text-sm text-green-600 font-medium">Status</div>
                                            <div class="text-lg font-bold text-green-800">Active</div>
                                        </div>
                                    </div>
                                </div>

                                <div class="p-6 bg-gradient-to-r from-purple-50 to-purple-100 rounded-lg border-l-4 border-purple-500">
                                    <div class="flex items-center">
                                        <i class="fas fa-clock text-purple-600 text-xl mr-3"></i>
                                        <div>
                                            <div class="text-sm text-purple-600 font-medium">Last Updated</div>
                                            <div class="text-lg font-bold text-purple-800">Recently</div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Action Buttons -->
                    <div class="mt-8 pt-6 border-t border-gray-200">
                        <div class="flex flex-wrap gap-4 justify-center">
                            <a th:href="@{/}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-3 rounded-lg transition duration-200 flex items-center">
                                <i class="fas fa-list mr-2"></i>
                                View All Cars
                            </a>
                            <a th:href="@{/create}" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-lg transition duration-200 flex items-center">
                                <i class="fas fa-plus mr-2"></i>
                                Add New Car
                            </a>
                            <a th:href="@{/car-dashboard}" class="bg-purple-500 hover:bg-purple-600 text-white px-6 py-3 rounded-lg transition duration-200 flex items-center">
                                <i class="fas fa-tachometer-alt mr-2"></i>
                                Modern Dashboard
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
