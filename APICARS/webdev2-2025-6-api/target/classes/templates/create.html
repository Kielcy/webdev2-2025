<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Car</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-gray-100 min-h-screen">
    <!-- Header -->
    <header class="bg-blue-600 text-white shadow-lg">
        <div class="container mx-auto px-4 py-6">
            <div class="flex justify-between items-center">
                <h1 class="text-3xl font-bold">
                    <i class="fas fa-car mr-2"></i>
                    Create New Car
                </h1>
                <div class="flex space-x-4">
                    <a th:href="@{/}" class="bg-gray-500 hover:bg-gray-600 text-white px-6 py-2 rounded-lg transition duration-200 flex items-center">
                        <i class="fas fa-arrow-left mr-2"></i>
                        Back to List
                    </a>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container mx-auto px-4 py-8">
        <div class="max-w-2xl mx-auto">
            <div class="bg-white rounded-lg shadow-md overflow-hidden">
                <div class="px-6 py-4 border-b border-gray-200">
                    <h2 class="text-xl font-semibold text-gray-800">Car Information</h2>
                    <p class="text-gray-600 mt-1">Fill in the details below to add a new car to the system.</p>
                </div>
                
                <form action="/save" method="post" th:object="${car}" class="p-6">
                    
                    <div class="space-y-6">
                        <div>
                            <label for="make" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-industry mr-1"></i>
                                Make
                            </label>
                            <input type="text" id="make" th:field="*{make}" placeholder="e.g., Toyota, Honda, Ford"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                            <div th:if="${#fields.hasErrors('make')}" th:errors="*{make}" 
                                 class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded"></div>
                        </div>
                        
                        <div>
                            <label for="model" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-car mr-1"></i>
                                Model
                            </label>
                            <input type="text" id="model" th:field="*{model}" placeholder="e.g., Camry, Civic, F-150"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                            <div th:if="${#fields.hasErrors('model')}" th:errors="*{model}" 
                                 class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded"></div>
                        </div>
                        
                        <div>
                            <label for="year" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-calendar mr-1"></i>
                                Year
                            </label>
                            <input type="number" id="year" th:field="*{year}" placeholder="e.g., 2023"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                            <div th:if="${#fields.hasErrors('year')}" th:errors="*{year}" 
                                 class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded"></div>
                        </div>
                        
                        <div>
                            <label for="color" class="block text-sm font-medium text-gray-700 mb-2">
                                <i class="fas fa-palette mr-1"></i>
                                Color
                            </label>
                            <input type="text" id="color" th:field="*{color}" placeholder="e.g., Red, Blue, Silver"
                                   class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition duration-200">
                            <div th:if="${#fields.hasErrors('color')}" th:errors="*{color}" 
                                 class="mt-2 text-sm text-red-600 bg-red-50 p-2 rounded"></div>
                        </div>
                    </div>
                    
                    <div class="flex justify-end space-x-4 mt-8">
                        <a th:href="@{/}" class="px-6 py-3 text-gray-600 border border-gray-300 rounded-lg hover:bg-gray-50 transition duration-200">
                            Cancel
                        </a>
                        <button type="submit" class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition duration-200 flex items-center">
                            <i class="fas fa-save mr-2"></i>
                            Save Car
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
