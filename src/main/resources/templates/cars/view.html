<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="'View Car - ' + ${car.make} + ' ' + ${car.model}">View Car - Car Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <i class="fas fa-car"></i> Car Management
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/cars">View Cars</a>
                <a href="/cars/add">Add Car</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title" th:text="${car.make + ' ' + car.model}">Car Details</h1>
            <p class="page-subtitle">Complete information about this vehicle</p>
        </div>

        <div class="card">
            <div class="car-image" style="height: 300px; margin-bottom: 0;">
                <i class="fas fa-car" style="font-size: 4rem;"></i>
            </div>
            <div class="car-info" style="padding: 2rem;">
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Make</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.make}">Toyota</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Model</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.model}">Camry</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Year</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.year}">2023</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Color</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.color}">Red</div>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Body Type</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.bodyType ?: 'Not specified'}">Sedan</div>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Engine Type</label>
                        <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.engineType ?: 'Not specified'}">V6</div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label">License Plate</label>
                    <div class="form-control" style="background: var(--gray-100); border: none;" th:text="${car.licensePlate ?: 'Not specified'}">ABC-123</div>
                </div>

                <div class="d-flex gap-2 mt-3">
                    <a th:href="@{/cars/edit/{id}(id=${car.id})}" class="btn btn-primary">
                        <i class="fas fa-edit"></i> Edit Car
                    </a>
                    <a href="/cars" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Back to List
                    </a>
                    <a th:href="@{/cars/delete/{id}(id=${car.id})}" 
                       class="btn btn-danger"
                       onclick="return confirm('Are you sure you want to delete this car?')">
                        <i class="fas fa-trash"></i> Delete Car
                    </a>
                </div>
            </div>
        </div>

        <div class="card mt-3">
            <div class="card-header">
                <h2 class="card-title">Vehicle Summary</h2>
            </div>
            <div class="card-body">
                <div class="form-row">
                    <div class="text-center">
                        <div style="font-size: 2rem; color: var(--primary-color); margin-bottom: 0.5rem;">
                            <i class="fas fa-calendar-alt"></i>
                        </div>
                        <h4>Year</h4>
                        <p th:text="${car.year}">2023</p>
                    </div>
                    <div class="text-center">
                        <div style="font-size: 2rem; color: var(--success-color); margin-bottom: 0.5rem;">
                            <i class="fas fa-palette"></i>
                        </div>
                        <h4>Color</h4>
                        <p th:text="${car.color}">Red</p>
                    </div>
                    <div class="text-center">
                        <div style="font-size: 2rem; color: var(--warning-color); margin-bottom: 0.5rem;">
                            <i class="fas fa-car-side"></i>
                        </div>
                        <h4>Body Type</h4>
                        <p th:text="${car.bodyType ?: 'N/A'}">Sedan</p>
                    </div>
                    <div class="text-center">
                        <div style="font-size: 2rem; color: var(--danger-color); margin-bottom: 0.5rem;">
                            <i class="fas fa-cog"></i>
                        </div>
                        <h4>Engine</h4>
                        <p th:text="${car.engineType ?: 'N/A'}">V6</p>
                    </div>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
