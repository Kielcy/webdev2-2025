<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Car - Car Management System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="header">
        <div class="header-content">
            <a href="/" class="logo">
                <i class="fas fa-car"></i> Car Management
            </a>
            <nav class="nav">
                <a href="/">Home</a>
                <a href="/cars">View Cars</a>
                <a href="/cars/add">Add Car</a>
            </nav>
        </div>
    </header>

    <main class="container">
        <div class="page-header">
            <h1 class="page-title">Add New Car</h1>
            <p class="page-subtitle">Enter the details for your new vehicle</p>
        </div>

        <div class="card">
            <div class="card-header">
                <h2 class="card-title">Car Information</h2>
            </div>
            <div class="card-body">
                <form th:action="@{/cars/add}" th:object="${car}" method="post">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="make" class="form-label">Make *</label>
                            <input type="text" 
                                   id="make" 
                                   th:field="*{make}" 
                                   class="form-control" 
                                   placeholder="e.g., Toyota, Honda, Ford"
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="model" class="form-label">Model *</label>
                            <input type="text" 
                                   id="model" 
                                   th:field="*{model}" 
                                   class="form-control" 
                                   placeholder="e.g., Camry, Civic, F-150"
                                   required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="year" class="form-label">Year *</label>
                            <input type="number" 
                                   id="year" 
                                   th:field="*{year}" 
                                   class="form-control" 
                                   placeholder="e.g., 2023"
                                   min="1900" 
                                   max="2030"
                                   required>
                        </div>
                        <div class="form-group">
                            <label for="color" class="form-label">Color *</label>
                            <input type="text" 
                                   id="color" 
                                   th:field="*{color}" 
                                   class="form-control" 
                                   placeholder="e.g., Red, Blue, Silver"
                                   required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="bodyType" class="form-label">Body Type</label>
                            <select id="bodyType" th:field="*{bodyType}" class="form-control">
                                <option value="">Select Body Type</option>
                                <option value="Sedan">Sedan</option>
                                <option value="SUV">SUV</option>
                                <option value="Hatchback">Hatchback</option>
                                <option value="Coupe">Coupe</option>
                                <option value="Convertible">Convertible</option>
                                <option value="Truck">Truck</option>
                                <option value="Van">Van</option>
                                <option value="Wagon">Wagon</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="engineType" class="form-label">Engine Type</label>
                            <select id="engineType" th:field="*{engineType}" class="form-control">
                                <option value="">Select Engine Type</option>
                                <option value="4-Cylinder">4-Cylinder</option>
                                <option value="6-Cylinder">6-Cylinder</option>
                                <option value="8-Cylinder">8-Cylinder</option>
                                <option value="Electric">Electric</option>
                                <option value="Hybrid">Hybrid</option>
                                <option value="Diesel">Diesel</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="licensePlate" class="form-label">License Plate</label>
                        <input type="text" 
                               id="licensePlate" 
                               th:field="*{licensePlate}" 
                               class="form-control" 
                               placeholder="e.g., ABC-123, XYZ-789"
                               style="text-transform: uppercase;">
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">
                            <i class="fas fa-save"></i> Save Car
                        </button>
                        <a href="/cars" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
