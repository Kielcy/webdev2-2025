<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:fragment="layout(content)">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} ?: 'Exam App'"></title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<header class="topbar">
    <div class="container flex space-between">
        <a class="brand" th:href="@{/}">Exam</a>
        <nav class="flex">
            <a th:href="@{/employees}">Employees</a>
            <form th:action="@{/logout}" method="post" style="display:inline" sec:authorize="isAuthenticated()">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
                <button class="btn btn-link" type="submit">Logout</button>
            </form>
        </nav>
    </div>
 </header>

 <main class="container">
     <div th:insert="${content}"></div>
 </main>

 <footer class="footer">
     <div class="container">Minimal Employee CRUD</div>
 </footer>
</body>
</html>
