<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout(~{::body})}">
<body>
<div class="card error-card">
    <h1>Page not found</h1>
    <p>The page you requested does not exist.</p>
    <a class="btn" th:href="@{/}">Go Home</a>
    <div sec:authorize="isAnonymous()" style="margin-top:10px">
        <p class="muted">You'll be redirected to login shortly...</p>
        <meta http-equiv="refresh" content="3;url=/login?errorFrom=1&status=404" />
    </div>
</div>
</body>
</html>
