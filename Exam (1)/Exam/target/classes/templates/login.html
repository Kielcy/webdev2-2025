<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<body>
<div class="card auth-card">
    <h1>Login</h1>
    <div class="error" th:if="${param.error}">
        <span th:if="${param.error[0]} == 'missing'">Username and password must not be null.</span>
        <span th:unless="${param.error[0]} == 'missing'">Invalid username or password.</span>
    </div>
    <div class="error" th:if="${param.errorFrom}">You were redirected here due to an error (status [[${param.status}]])</div>
    <div class="muted" th:if="${param.logout}">You have been logged out.</div>
    <form th:action="@{/login}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
        <div class="form-group">
            <label for="username">Username</label>
            <input id="username" name="username" type="text" />
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" />
        </div>
        <div class="actions">
            <button class="btn" type="submit">Login</button>
        </div>
    </form>
</div>
</body>
</html>
