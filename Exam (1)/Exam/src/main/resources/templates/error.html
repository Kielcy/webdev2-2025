<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" th:replace="~{layout :: layout(~{::body})}">
<body>
<div class="card error-card">
    <h1 th:text="${error} ?: 'Something went wrong'"></h1>
    <p th:text="${message} ?: 'An unexpected error occurred.'"></p>
    <p class="muted" th:if="${status}" th:text="'Status: ' + ${status}"></p>
    <a class="btn" th:href="@{/}">Go Home</a>
    <div sec:authorize="isAnonymous()" style="margin-top:10px">
        <p class="muted">You'll be redirected to login shortly...</p>
        <meta http-equiv="refresh" th:content="'3;url=/login?errorFrom=1&status=' + ${status}" />
    </div>
 </div>
</body>
</html>
