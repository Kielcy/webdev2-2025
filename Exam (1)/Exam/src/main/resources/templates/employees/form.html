<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" th:replace="~{layout :: layout(~{::body})}">
<body>
<div class="card">
    <h1 th:text="${employee.id} != null ? 'Edit Employee' : 'New Employee'"></h1>
    <form th:action="${employee.id} != null ? @{'/employees/' + ${employee.id}} : @{/employees}"
          th:object="${employee}" method="post" class="form">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

        <div class="form-group">
            <label for="name">Name</label>
            <input id="name" type="text" th:field="*{name}" placeholder="Full name"/>
            <div class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input id="email" type="email" th:field="*{email}" placeholder="email@example.com"/>
            <div class="error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
        </div>

        <div class="actions">
            <a class="btn btn-link" th:href="@{/employees}">Cancel</a>
            <button class="btn" type="submit">Save</button>
        </div>
    </form>
</div>
</body>
</html>
